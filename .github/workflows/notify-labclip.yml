name: Notify LabCLIP of IaC update

on:
  push:
    branches:
      - develop

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create destination dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.IAC_SYNC_APP_ID }}
          private-key: ${{ secrets.IAC_SYNC_APP_PRIVATE_KEY }}
          owner: jayn2u
          repositories: lab_clip
          permission-contents: write
      - name: Notify LabCLIP
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api
          --method POST
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
          repos/jayn2u/lab_clip/dispatches
          --field event_type=labclip-iac-updated
          --field "client_payload[source_sha]=$SOURCE_SHA"
          --field "client_payload[source_ref]=$SOURCE_REF"
          --field "client_payload[source_run_url]=$SOURCE_RUN_URL"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: three-t-runner
  namespace: three-t-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: three-t-runner
  namespace: three-t-pipeline
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: three-t-runner
  namespace: three-t-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: three-t-runner
subjects:
  - kind: ServiceAccount
    name: three-t-runner
    namespace: three-t-pipeline

---
apiVersion: three-t-clip-pipeline/v1alpha1
kind: Workload
metadata:
  name: python-job
spec:
  bundle:
    s3Uri: s3://consumer-code/python-job.bundle
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  execution:
    image: >-
      registry.example/python-job@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    command: [python, job.py]
    workingDirectory: app
  resources:
    cacheProfile: accelerator-a
    gpuResource: vendor.example/gpu
    gpuCount: 1
    cpu: "2"
    memory: 1Gi
  timeouts: {}
  outputs:
    bucket: consumer-results
    prefix: runs/python-job
    requiredPaths: [result.json, provenance.json]

---
- name: Assert the node IP is configured
  ansible.builtin.assert:
    that:
      - k3s_node_ip is defined
      - k3s_node_ip is match('^[0-9.]+$')
    fail_msg: "Set k3s_node_ip for {{ inventory_hostname }}."

- name: Assert a pinned k3s release asset exists for this architecture
  ansible.builtin.assert:
    that: ansible_architecture in k3s_release_assets
    fail_msg: "No pinned k3s release checksum for {{ ansible_architecture }}."

- name: Check currently installed k3s version
  ansible.builtin.command:
    argv:
      - "{{ k3s_binary_path }}"
      - --version
  register: k3s_current_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Extract the installed k3s version
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_current_version.stdout | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+') }}"
  when: k3s_current_version.rc == 0

- name: Refuse to downgrade k3s
  ansible.builtin.assert:
    that:
      - k3s_current_version.rc != 0 or
        (k3s_installed_version is version(k3s_version, '<=', version_type='loose'))
    fail_msg: >-
      Refusing to replace installed k3s {{ k3s_installed_version | default('unknown') }}
      with older requested version {{ k3s_version }}.

- name: Install the pinned k3s binary after verifying its release checksum
  ansible.builtin.get_url:
    url: "{{ k3s_release_base_url }}/{{ k3s_version | urlencode }}/{{ k3s_release_assets[ansible_architecture].name }}"
    checksum: "sha256:{{ k3s_release_assets[ansible_architecture].sha256 }}"
    dest: "{{ k3s_binary_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart k3s service

- name: Check existing k3s helper command paths
  ansible.builtin.stat:
    path: "{{ k3s_binary_path | dirname }}/{{ item }}"
  loop: "{{ k3s_binary_links }}"
  register: k3s_binary_link_paths

- name: Link missing k3s helper commands without replacing existing tools
  ansible.builtin.file:
    src: "{{ k3s_binary_path }}"
    dest: "{{ item.stat.path | default(k3s_binary_path | dirname ~ '/' ~ item.item) }}"
    state: link
  loop: "{{ k3s_binary_link_paths.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Ensure the k3s configuration directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the k3s configuration file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ k3s_service_role == 'agent' }}"
  notify: restart k3s service

- name: Render the k3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "{{ k3s_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart k3s service

- name: Ensure the k3s systemd drop-in directory exists
  ansible.builtin.file:
    path: "{{ k3s_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Require persistent mounts before k3s starts
  ansible.builtin.template:
    src: mount.conf.j2
    dest: "{{ k3s_dropin_dir }}/mount.conf"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart k3s service

- name: Apply pending systemd and k3s changes
  ansible.builtin.meta: flush_handlers

- name: Ensure the k3s service is enabled and running
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

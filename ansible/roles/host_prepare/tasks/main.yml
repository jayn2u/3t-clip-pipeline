---

- name: Load kernel modules required by k3s networking
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ required_kernel_modules }}"

- name: Persist kernel modules across reboot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: "{{ required_kernel_modules | join('\n') }}\n"
    mode: "0644"

- name: Apply required sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ required_sysctl | dict2items }}"

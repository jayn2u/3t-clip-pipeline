---
# Installs the single k3s control-plane node. Idempotent: re-running with the
# same k3s_version is a no-op (the installer checks the installed version).
# This is the sole control-plane per docs/cluster/00-current-architecture.md;
# a second server node is out of scope here (would need an HA datastore decision first).

- name: Check currently installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false

- name: Download and install k3s server
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL {{ k3s_install_url }} | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      INSTALL_K3S_EXEC="server --disable={{ k3s_disable_components | join(',') }}" \
      sh -
  args:
    executable: /bin/bash
  when: k3s_current_version.rc != 0 or k3s_version not in k3s_current_version.stdout

- name: Ensure k3s server is enabled and running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for node-token to be written
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 60

- name: Read the cluster join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_raw

- name: Expose the join token as a fact for k3s_agent
  ansible.builtin.set_fact:
    k3s_join_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"
  no_log: true

- name: Wait for the API server to accept connections
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    timeout: 60

- name: Fetch kubeconfig for downstream Terraform use
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_kubeconfig_fetch_dest }}"
    flat: true

- name: Rewrite fetched kubeconfig to point at the reachable server address
  ansible.builtin.replace:
    path: "{{ k3s_kubeconfig_fetch_dest }}"
    regexp: '127\.0\.0\.1'
    replace: "{{ ansible_host }}"
  delegate_to: localhost

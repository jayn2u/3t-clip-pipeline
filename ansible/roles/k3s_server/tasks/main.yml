---

- name: Validate k3s data directory before installation
  ansible.builtin.include_role:
    name: k3s_data_dir_guard

- name: Assert the control-plane node IP is configured
  ansible.builtin.assert:
    that:
      - k3s_node_ip is defined
      - k3s_node_ip is match('^[0-9.]+$')
    fail_msg: "Set k3s_node_ip for {{ inventory_hostname }}."

- name: Check currently installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Extract the installed k3s version
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_current_version.stdout | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+') }}"
  when: k3s_current_version.rc == 0

- name: Refuse to downgrade k3s
  ansible.builtin.assert:
    that:
      - k3s_current_version.rc != 0 or
        (k3s_installed_version is version(k3s_version, '<=', version_type='loose'))
    fail_msg: >-
      Refusing to replace installed k3s {{ k3s_installed_version | default('unknown') }}
      with older requested version {{ k3s_version }}.

- name: Download and install k3s server
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL "{{ k3s_install_url }}" | sh -
  args:
    executable: /bin/bash
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_DATA_DIR: "{{ k3s_data_dir }}"
    INSTALL_K3S_EXEC: >-
      server --disable={{ k3s_disable_components | join(',') }}
      --node-ip={{ k3s_node_ip }} --node-name={{ inventory_hostname }}
  when: k3s_current_version.rc != 0 or k3s_installed_version != k3s_version

- name: Ensure k3s server is enabled and running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Wait for node-token to be written
  ansible.builtin.wait_for:
    path: "{{ k3s_token_file }}"
    timeout: 60
  when: not ansible_check_mode

- name: Read the cluster join token
  ansible.builtin.slurp:
    src: "{{ k3s_token_file }}"
  register: k3s_node_token_raw
  no_log: true
  when: not ansible_check_mode

- name: Expose the join token as a fact for k3s_agent
  ansible.builtin.set_fact:
    k3s_join_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"
  no_log: true
  when: not ansible_check_mode

- name: Wait for the API server to accept connections
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    timeout: 60
  when: not ansible_check_mode

- name: Create a private local directory for Terraform's kubeconfig
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_fetch_dest | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Read kubeconfig for downstream Terraform use
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw
  no_log: true
  when: not ansible_check_mode

- name: Write a private kubeconfig for Terraform with the reachable API address
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_raw.content | b64decode | replace('https://127.0.0.1:6443', 'https://' + k3s_server_address + ':6443') }}"
    dest: "{{ k3s_kubeconfig_fetch_dest }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  when: not ansible_check_mode

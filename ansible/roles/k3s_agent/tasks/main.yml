---

- name: Validate k3s data directory before joining
  ansible.builtin.include_role:
    name: k3s_data_dir_guard

- name: Assert join token was provided by the server play
  ansible.builtin.assert:
    that: hostvars[k3s_server_host]['k3s_join_token'] is defined
    fail_msg: "k3s join token missing - did the server role run first?"
  when: not ansible_check_mode

- name: Assert the worker node IP is configured
  ansible.builtin.assert:
    that:
      - k3s_node_ip is defined
      - k3s_node_ip is match('^[0-9.]+$')
    fail_msg: "Set k3s_node_ip for {{ inventory_hostname }}."

- name: Check currently installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Extract the installed k3s version
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_current_version.stdout | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+') }}"
  when: k3s_current_version.rc == 0

- name: Refuse to downgrade k3s
  ansible.builtin.assert:
    that:
      - k3s_current_version.rc != 0 or
        (k3s_installed_version is version(k3s_version, '<=', version_type='loose'))
    fail_msg: >-
      Refusing to replace installed k3s {{ k3s_installed_version | default('unknown') }}
      with older requested version {{ k3s_version }}.

- name: Download and install k3s agent
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL "{{ k3s_install_url }}" | sh -
  args:
    executable: /bin/bash
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_DATA_DIR: "{{ k3s_data_dir }}"
    INSTALL_K3S_EXEC: >-
      agent --node-ip={{ k3s_node_ip }} --node-name={{ inventory_hostname }}
    K3S_URL: "https://{{ k3s_server_address }}:6443"
    K3S_TOKEN: "{{ hostvars[k3s_server_host]['k3s_join_token'] }}"
  when:
    - not ansible_check_mode
    - k3s_current_version.rc != 0 or k3s_installed_version != k3s_version
  no_log: true

- name: Ensure k3s agent is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
  when: not ansible_check_mode

---
# Joins a worker node to the k3s server. Depends on k3s_join_token being set by
# k3s_server, so this role must run after k3s_server in the play (see playbooks/site.yml).

- name: Assert join token was provided by the server play
  ansible.builtin.assert:
    that: hostvars[k3s_server_host]['k3s_join_token'] is defined
    fail_msg: "k3s_join_token missing - did the k3s_server role run first, in the same play?"

- name: Check currently installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false

- name: Download and install k3s agent
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL {{ k3s_install_url }} | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      K3S_URL="https://{{ hostvars[k3s_server_host]['ansible_host'] }}:6443" \
      K3S_TOKEN="{{ hostvars[k3s_server_host]['k3s_join_token'] }}" \
      sh -
  args:
    executable: /bin/bash
  when: k3s_current_version.rc != 0 or k3s_version not in k3s_current_version.stdout
  no_log: true

- name: Ensure k3s agent is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true

---

- name: Check whether NVIDIA container toolkit is already installed
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Version}
      - nvidia-container-toolkit
  register: nvidia_toolkit_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Add NVIDIA container toolkit signing key for a new installation
  ansible.builtin.apt_key:
    url: "{{ nvidia_container_toolkit_repo_key_url }}"
    keyring: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    state: present
  when: nvidia_toolkit_installed.rc != 0

- name: Add NVIDIA container toolkit apt repository for a new installation
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg]
      {{ nvidia_container_toolkit_repo_url }}
    state: present
    filename: nvidia-container-toolkit
  when: nvidia_toolkit_installed.rc != 0

- name: Install pinned NVIDIA container toolkit when it is absent
  ansible.builtin.apt:
    name: "nvidia-container-toolkit={{ nvidia_container_toolkit_version }}"
    state: present
    update_cache: true
  when: nvidia_toolkit_installed.rc != 0
  notify: restart k3s

- name: Verify NVIDIA runtime is available to k3s
  ansible.builtin.command:
    argv:
      - nvidia-container-runtime
      - --version
  changed_when: false
  check_mode: false

- name: Verify host GPU is visible
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - -L
  changed_when: false
  check_mode: false

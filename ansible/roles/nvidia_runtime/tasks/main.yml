---

- name: Check whether NVIDIA container toolkit is already installed
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Version}
      - nvidia-container-toolkit
  register: nvidia_toolkit_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: "{{ nvidia_container_toolkit_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nvidia_toolkit_installed.rc != 0

- name: Download the pinned NVIDIA container toolkit signing key into a dedicated keyring
  ansible.builtin.get_url:
    url: "{{ nvidia_container_toolkit_repo_key_url }}"
    dest: "{{ nvidia_container_toolkit_keyring }}"
    checksum: "sha256:{{ nvidia_container_toolkit_repo_key_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: nvidia_toolkit_installed.rc != 0

- name: Add NVIDIA container toolkit apt repository for a new installation
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ nvidia_container_toolkit_keyring }}]
      {{ nvidia_container_toolkit_repo_url }}
    state: present
    filename: nvidia-container-toolkit
  when: nvidia_toolkit_installed.rc != 0

- name: Install pinned NVIDIA container toolkit when it is absent
  ansible.builtin.apt:
    name: "nvidia-container-toolkit={{ nvidia_container_toolkit_version }}"
    state: present
    update_cache: true
  when: nvidia_toolkit_installed.rc != 0
  notify: restart k3s

- name: Verify NVIDIA runtime is available to k3s
  ansible.builtin.command:
    argv:
      - nvidia-container-runtime
      - --version
  changed_when: false
  check_mode: false

- name: Verify host GPU is visible
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - -L
  changed_when: false
  check_mode: false

- name: Check whether the running k3s containerd config registers the NVIDIA runtime
  ansible.builtin.command:
    argv:
      - grep
      - --quiet
      - --fixed-strings
      - "{{ nvidia_k3s_runtime_marker }}"
      - "{{ nvidia_k3s_containerd_config }}"
  register: nvidia_k3s_runtime_registered
  changed_when: nvidia_k3s_runtime_registered.rc != 0
  failed_when: nvidia_k3s_runtime_registered.rc > 2
  check_mode: false
  notify: restart k3s

- name: Restart k3s now so containerd regenerates its runtime config
  ansible.builtin.meta: flush_handlers

- name: Wait for k3s to regenerate a containerd config with the NVIDIA runtime
  ansible.builtin.wait_for:
    path: "{{ nvidia_k3s_containerd_config }}"
    search_regex: "{{ nvidia_k3s_runtime_marker }}"
    timeout: 120
  when:
    - not ansible_check_mode
    - nvidia_k3s_runtime_registered is changed

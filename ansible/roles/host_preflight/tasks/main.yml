---

- name: Assert supported OS family
  ansible.builtin.assert:
    that: ansible_facts['os_family'] in ['Debian']
    fail_msg: "Unsupported OS family: {{ ansible_facts['os_family'] }}"

- name: Verify required kernel modules are available
  ansible.builtin.command:
    argv:
      - modinfo
      - -F
      - filename
      - "{{ item }}"
  loop: "{{ required_kernel_modules }}"
  register: required_kernel_module_checks
  changed_when: false
  check_mode: false

- name: Assert required kernel modules are available
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: "Required kernel module {{ item.item }} is unavailable."
  loop: "{{ required_kernel_module_checks.results }}"

- name: Assert persistent storage roots are explicitly configured
  ansible.builtin.assert:
    that:
      - storage_mount is defined
      - storage_mount.startswith('/')
      - cache_root is defined
      - cache_root.startswith(storage_mount.rstrip('/') + '/')
      - minio_role is not defined or
        (minio_data_root is defined and minio_data_root.startswith(storage_mount.rstrip('/') + '/'))
    fail_msg: >-
      Set storage_mount, cache_root, and (for a MinIO node) minio_data_root
      to absolute paths on the same persistent mounted filesystem.

- name: Inspect the filesystem that will hold persistent data
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --output
      - TARGET
      - --target
      - "{{ storage_mount }}"
  register: storage_mount_check
  changed_when: false
  failed_when: storage_mount_check.rc != 0
  check_mode: false

- name: Assert storage mount is present at the expected mount point
  ansible.builtin.assert:
    that: storage_mount_check.stdout | trim == storage_mount
    fail_msg: >-
      Expected persistent storage at {{ storage_mount }}, but findmnt reports
      {{ storage_mount_check.stdout | trim | default('no mount') }}.

- name: Verify GPU is visible to the host
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - -L
  register: nvidia_smi_check
  changed_when: false
  failed_when: nvidia_smi_check.rc != 0
  check_mode: false
  when: node_gpu_model is defined

- name: Assert the declared GPU model is present
  ansible.builtin.assert:
    that: node_gpu_model in nvidia_smi_check.stdout
    fail_msg: >-
      Expected GPU '{{ node_gpu_model }}' not found in nvidia-smi output:
      {{ nvidia_smi_check.stdout }}
  when: node_gpu_model is defined

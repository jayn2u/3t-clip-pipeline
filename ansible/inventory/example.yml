---
all:
  children:
    k3s_cluster:
      children:
        server:
          hosts:
            k3s-server-1:
              ansible_host: 192.0.2.10
              platform_hostname: k3s-server-1
              platform_machine_id: replace-with-machine-id
        agent:
          hosts:
            k3s-agent-1:
              ansible_host: 192.0.2.11
              platform_hostname: k3s-agent-1
              platform_machine_id: replace-with-unique-machine-id
      vars:
        ansible_user: ubuntu
        host_preflight_required_ports_open: true
        host_preflight_firewall_policy_valid: true
        host_preflight_storage_mount: /mnt/clip-data
        k3s_initial_bootstrap: true

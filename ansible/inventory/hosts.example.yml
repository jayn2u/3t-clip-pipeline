all:
  children:
    k3s_server:
      hosts:
        vis-lab:
          ansible_host: 10.0.0.10
          ansible_user: ops
          k3s_node_ip: 10.0.0.10
          node_gpu_model: "RTX 5070 Ti"
          storage_mount: /mnt/data
          k3s_data_dir: /mnt/data/labclip-k3s
          cache_root: /mnt/data/labclip-cache
          cache_capacity_gi: 200
          minio_role: minio-code
          minio_data_root: /mnt/data/minio-code
    k3s_agent:
      hosts:
        ubuntu:
          ansible_host: 10.0.0.11
          ansible_user: ops
          k3s_node_ip: 10.0.0.11
          node_gpu_model: "RTX A6000"
          storage_mount: /data
          k3s_data_dir: /data/jayn2u/labclip-k3s
          cache_root: /data/jayn2u/labclip-cache
          cache_capacity_gi: 800
          minio_role: minio-ml-assets
          minio_data_root: /data/jayn2u/minio
    gpu_nodes:
      children:
        k3s_server:
        k3s_agent:
    k3s_cluster:
      children:
        k3s_server:
        k3s_agent:

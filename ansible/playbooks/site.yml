---

- name: Verify hosts before making any change
  import_playbook: preflight.yml

- name: Prepare persistent directories on every node
  hosts: k3s_cluster
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - local_storage

- name: Prepare host networking prerequisites for k3s
  hosts: k3s_cluster
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  roles:
    - host_prepare

- name: Install and start the k3s control plane
  hosts: k3s_server
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - k3s_server

- name: Join worker nodes to the control plane
  hosts: k3s_agent
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - k3s_agent

- name: Install and register the NVIDIA runtime on every node
  hosts: k3s_cluster
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - nvidia_runtime

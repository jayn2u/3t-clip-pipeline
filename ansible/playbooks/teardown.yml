---

- name: Refuse to run without explicit confirmation
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Assert confirm_teardown was passed
      ansible.builtin.assert:
        that: confirm_teardown | default(false) | bool
        fail_msg: >-
          Refusing to tear down the cluster without confirmation.
          Re-run with -e confirm_teardown=yes. Teardown keeps k3s_data_dir,
          kubelet, and pod-log data unless -e k3s_teardown_purge=true is also passed.

- name: Validate every k3s data directory before teardown
  hosts: k3s_cluster
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../group_vars/all.yml
  vars:
    k3s_data_dir_guard_allow_legacy: true
  roles:
    - k3s_data_dir_guard

- name: Remove k3s from worker nodes
  hosts: k3s_agent
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  roles:
    - k3s_teardown

- name: Remove k3s from the control-plane node
  hosts: k3s_server
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  roles:
    - k3s_teardown
  tasks:
    - name: Remove the fetched kubeconfig used by Terraform
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_fetch_dest }}"
        state: absent
      delegate_to: localhost
      become: false

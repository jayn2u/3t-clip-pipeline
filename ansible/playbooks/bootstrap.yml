---
- name: Validate cluster topology
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require one or three k3s servers
      ansible.builtin.assert:
        that: groups.get('server', []) | length in [1, 3]
        fail_msg: ha_requires_three_servers
        quiet: true

- name: Validate bootstrap contract
  hosts: k3s_cluster
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: ../roles/host_preflight  # noqa: role-name[path]
    - role: ../roles/k3s_adapter  # noqa: role-name[path]

- name: Bootstrap the pinned k3s cluster
  ansible.builtin.import_playbook: k3s.orchestration.site
  when: not k3s_adapter_fake_host_mode | default(false) | bool

- name: Protect the task-owned kubeconfig
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Enforce private kubeconfig permissions
      ansible.builtin.file:
        path: "{{ kubeconfig }}"
        mode: "0600"
        state: file

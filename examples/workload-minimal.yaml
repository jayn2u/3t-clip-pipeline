apiVersion: three-t-clip-pipeline/v1alpha1
kind: Workload
metadata:
  name: minimal
spec:
  bundle:
    s3Uri: s3://pipeline-code/bundles/minimal.tar.gz
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  execution:
    image: registry.example/workload@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    command:
      - python
      - run.py
    workingDirectory: workspace
  resources:
    cpu: "1"
    memory: 1Gi
  timeouts: {}
  outputs:
    bucket: pipeline-results
    prefix: runs/minimal
    requiredPaths:
      - metrics.json
